<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Kamrul Hasan — AI Agent Engineer. The model proposes, a human approves, code commits.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="0.55" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#0e0b1f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a2e"/>
      <stop offset="1" stop-color="#0c1222"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" opacity="0.10"/>
    </pattern>
    <linearGradient id="dotFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.6"/>
    </linearGradient>
    <mask id="dotMask"><rect width="1280" height="360" fill="url(#dotFade)"/></mask>
    <clipPath id="frame"><rect width="1280" height="360" rx="18"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .flow { stroke-dasharray: 5 7; animation: flow 1.4s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @keyframes pulse { 0%, 100% { opacity: 0.25; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.12); } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .flow, .pulse, .blink { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- background -->
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#dots)" mask="url(#dotMask)"/>
    <rect width="1280" height="360" fill="url(#glowA)"/>
    <rect width="1280" height="360" fill="url(#glowB)"/>

    <!-- LEFT: identity -->
    <circle cx="78" cy="84" r="4" fill="#34d399"/>
    <circle class="pulse" cx="78" cy="84" r="8" fill="#34d399" opacity="0.3"/>
    <text class="mono" x="96" y="89" font-size="13" font-weight="600" letter-spacing="2.5" fill="#94a3b8">FOUNDER &amp; CTO · SOCIOFI</text>

    <text class="sans" x="70" y="160" font-size="64" font-weight="800" letter-spacing="-1" fill="#f8fafc">Kamrul Hasan</text>
    <text class="sans" x="72" y="206" font-size="27" font-weight="600" fill="url(#accent)">AI Agent Engineer</text>

    <text class="mono" x="72" y="254" font-size="15" fill="#aab4cf"><tspan fill="#34d399">$</tspan> the model proposes, the system disposes<tspan class="blink" fill="#818cf8"> ▊</tspan></text>

    <g class="mono" font-size="12" fill="#c7d2fe" text-anchor="middle">
      <g fill="#111a30" stroke="#2a3760" stroke-width="1">
        <rect x="72"  y="278" width="82"  height="26" rx="13"/>
        <rect x="162" y="278" width="74"  height="26" rx="13"/>
        <rect x="244" y="278" width="96"  height="26" rx="13"/>
        <rect x="348" y="278" width="67"  height="26" rx="13"/>
        <rect x="423" y="278" width="132" height="26" rx="13"/>
      </g>
      <text x="113" y="295">garments</text>
      <text x="199" y="295">permits</text>
      <text x="292" y="295">healthcare</text>
      <text x="381.5" y="295">hiring</text>
      <text x="489" y="295">public services</text>
    </g>

    <!-- RIGHT: the approval loop -->
    <rect x="744" y="58" width="464" height="244" rx="14" fill="url(#panel)" stroke="#243154" stroke-width="1"/>
    <rect x="744.5" y="58.5" width="463" height="243" rx="14" fill="none" stroke="url(#accent)" stroke-opacity="0.25"/>
    <circle cx="766" cy="80" r="4.5" fill="#f87171" opacity="0.8"/>
    <circle cx="782" cy="80" r="4.5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="798" cy="80" r="4.5" fill="#34d399" opacity="0.8"/>
    <text class="mono" x="976" y="84" font-size="12" text-anchor="middle" fill="#7c89ab">pending_changes</text>
    <path d="M744 100 H1208" stroke="#243154" stroke-width="1"/>

    <!-- connectors -->
    <path class="flow" d="M850 172 H946"   stroke="#818cf8" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
    <path class="flow" d="M1006 172 H1102" stroke="#818cf8" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

    <!-- node 1: model proposes -->
    <circle class="pulse" cx="820" cy="172" r="30" fill="#22d3ee" opacity="0.25"/>
    <circle cx="820" cy="172" r="26" fill="#0b1324" stroke="#22d3ee" stroke-width="1.8"/>
    <path d="M820 158 L823.5 168.5 L834 172 L823.5 175.5 L820 186 L816.5 175.5 L806 172 L816.5 168.5 Z" fill="#67e8f9"/>

    <!-- node 2: human approves -->
    <circle cx="976" cy="172" r="26" fill="#0b1324" stroke="#818cf8" stroke-width="1.8"/>
    <path d="M964 173 L972.5 181 L988 164" fill="none" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- node 3: code commits -->
    <circle cx="1132" cy="172" r="26" fill="#0b1324" stroke="#e879f9" stroke-width="1.8"/>
    <path d="M1126 163 L1117 172 L1126 181 M1138 163 L1147 172 L1138 181" fill="none" stroke="#f0abfc" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <g class="mono" text-anchor="middle">
      <g font-size="13" font-weight="700" letter-spacing="2" fill="#e2e8f0">
        <text x="820" y="226">PROPOSE</text>
        <text x="976" y="226">APPROVE</text>
        <text x="1132" y="226">COMMIT</text>
      </g>
      <g font-size="12" fill="#7c89ab">
        <text x="820" y="244">model</text>
        <text x="976" y="244">human</text>
        <text x="1132" y="244">code</text>
      </g>
      <path d="M768 262 H1184" stroke="#1c2745" stroke-width="1"/>
      <text x="976" y="284" font-size="11.5" fill="#6b7899">capped: steps · tokens · cost · time</text>
    </g>

    <!-- bottom accent line -->
    <rect x="0" y="356" width="1280" height="4" fill="url(#accent)" opacity="0.9"/>
  </g>
</svg>
