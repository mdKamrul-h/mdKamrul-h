<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Kamrul Hasan — AI Agent Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="0.5" stop-color="#0b0f1d"/>
      <stop offset="1" stop-color="#100b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="edgeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.08" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.92" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glowL)"/>
  <rect width="1280" height="360" fill="url(#glowR)"/>

  <!-- faint grid -->
  <g stroke="#94a3b8" stroke-width="0.5" opacity="0.04">
    <path d="M0 120 H1280 M0 240 H1280"/>
    <path d="M213 0 V360 M426 0 V360 M640 0 V360 M853 0 V360 M1066 0 V360"/>
  </g>

  <!-- LEFT agent-graph: strictly inside x 30..215, fades toward center -->
  <g>
    <path d="M95 180 C 130 110, 150 95, 185 80"  stroke="url(#edgeL)" stroke-width="1.5" fill="none"/>
    <path d="M95 180 C 140 180, 160 180, 195 180" stroke="url(#edgeL)" stroke-width="1.5" fill="none"/>
    <path d="M95 180 C 130 250, 150 265, 185 280" stroke="url(#edgeL)" stroke-width="1.5" fill="none"/>
    <circle cx="95" cy="180" r="20" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="95" cy="180" r="6" fill="#7dd3fc"/>
    <g fill="#0b0f1d" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.3">
      <rect x="182" y="68"  width="24" height="22" rx="6"/>
      <rect x="192" y="169" width="24" height="22" rx="6"/>
      <rect x="182" y="268" width="24" height="22" rx="6"/>
    </g>
  </g>

  <!-- RIGHT agent-graph: strictly inside x 1065..1250 -->
  <g>
    <path d="M1185 180 C 1150 110, 1130 95, 1095 80"  stroke="url(#edgeR)" stroke-width="1.5" fill="none"/>
    <path d="M1185 180 C 1140 180, 1120 180, 1085 180" stroke="url(#edgeR)" stroke-width="1.5" fill="none"/>
    <path d="M1185 180 C 1150 250, 1130 265, 1095 280" stroke="url(#edgeR)" stroke-width="1.5" fill="none"/>
    <circle cx="1185" cy="180" r="20" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="1185" cy="180" r="6" fill="#e9d5ff"/>
    <g fill="#0b0f1d" stroke="#c084fc" stroke-opacity="0.7" stroke-width="1.3">
      <rect x="1074" y="68"  width="24" height="22" rx="6"/>
      <rect x="1064" y="169" width="24" height="22" rx="6"/>
      <rect x="1074" y="268" width="24" height="22" rx="6"/>
    </g>
  </g>

  <!-- CENTER text: zone x 240..1040 is kept 100% free of graphics -->
  <text x="640" y="140" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="58"
        font-weight="800" letter-spacing="6" fill="#f8fafc">KAMRUL HASAN</text>

  <rect x="465" y="168" width="350" height="44" rx="22" fill="#0f172a" stroke="url(#accent)" stroke-width="1.5"/>
  <text x="640" y="197" text-anchor="middle"
        font-family="Menlo, Consolas, monospace" font-size="17"
        font-weight="600" letter-spacing="3" fill="#a5b4fc">AI AGENT ENGINEER</text>

  <text x="640" y="262" text-anchor="middle"
        font-family="Menlo, Consolas, monospace" font-size="15" fill="#8b95b5">
    <tspan fill="#34d399">$</tspan> agents · mcp · small models · rag <tspan fill="#64748b">—</tspan> shipped to production
  </text>

  <!-- bottom accent line -->
  <rect x="0" y="356" width="1280" height="4" fill="url(#accent)" opacity="0.85"/>
</svg>
