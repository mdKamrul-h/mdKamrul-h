<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" role="img" aria-label="Parul — Pet adoption and rescue community. Open Testing · Community. adopt → rescue → reunite → vet help">
  <defs>
